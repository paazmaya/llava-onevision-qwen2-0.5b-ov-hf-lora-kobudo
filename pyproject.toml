[project]
name = "llava-onevision-qwen2-0.5b-ov-hf-lora-kobudo"
version = "1.0.0"
license = "Apache-2.0"
description = "AI-powered image classifier for human detection and gender classification"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "torch==2.11.0",
  "torchvision==0.26.0",
  "transformers==5.5.4",
  "peft==0.19.1",
  "Pillow==12.2.0",
  "numpy==2.4.4",
  "tensorboard==2.20.0",
]

[dependency-groups]
dev = ["ruff==0.15.11"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
