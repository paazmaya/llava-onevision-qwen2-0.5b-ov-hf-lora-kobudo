# items.toml — Caption data for Okinawan martial arts item recognition
#
# Structure
# ---------
# [general]
#   Contains shared text used when building captions:
#     fallback_caption  — used when no filename keyword matches any item
#     prompt_prefix     — prepended to each matched item description
#
# [<category>]   (e.g. [kobudo], [karate], or any name you add)
#   Each key is a lowercase keyword that is searched for inside the image
#   filename (underscores and hyphens are treated as spaces before matching).
#   The value is a plain-English description appended to prompt_prefix.
#
# Adding items
# ------------
# Simply add a new key = "description" line to an existing category section,
# or create a new section (e.g. [judo]) and add keys there.
# All non-[general] sections are merged into one lookup table at runtime,
# so category names exist only for human organisation — they carry no
# special meaning to the loader.

[general]
fallback_caption = "Describe this Okinawan martial arts equipment in detail, including its name, type, traditional use, and any distinguishing features. Respond in English only."
prompt_prefix    = "Describe this Okinawan martial arts item in detail."

